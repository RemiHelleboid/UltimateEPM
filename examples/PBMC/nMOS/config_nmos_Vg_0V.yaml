# 2D self-consistent PBMC example for an nMOS device.
# Add a device.msh file in this directory with contact regions named
# "source", "drain", "body", and "gate".

input:
  device_mesh: nmos.msh
  material_root: ""
  material: Si

run:
  name: nmos
  output_directory: nMOS_Vg_0V
  threads: 1
  seed: 0

simulation:
  final_time_s: 10e-12
  time_step_s: 1e-16
  temperature_K: 300
  max_particles: 1000000000
  poisson_frequency: 5
  stop_when_no_electrons: true

transport:
  max_energy_eV: 0.4
  gamma_safety_factor: 1.2
  gamma_samples: 1000
  impact_ionization: false
  particle_creation: false
  impurity_scattering: false
  impurity_model: mobility
  impurity_screening: debye
  boundary_reflection: specular


poisson_mixing:
  enabled: false
  old_solution_fraction: 0.8

contacts:
  voltages_V:
    source: 0.0
    drain: 0.1
    body: 0.0
    gate: 0.0
  collecting:
    source: true
    drain: true
  ramo_electrode: drain
  apply_built_in_potential: true
  built_in_voltage_scale: 1.0

particles:
  initial_electrons: 0
  initial_holes: 0
  initial_position:
    x_um: 0.0
    y_um: 0.0
    z_um: 0.0
  initialize_from_doping: true
  initial_weight: 1.0
  initial_state_file: ""
  contact_injection_weight: 1.0

current_probe:
  enabled: true
  x_min_um: 0.06
  x_max_um: 0.19
  y_min_um: 0.08
  y_max_um: 0.20
  z_min_um: 0.0
  z_max_um: 0.0

geometry_2d:
  effective_depth_um: 0.25

scheduled_injection:
  enabled: false
  time_s: 0.0
  position:
    x_um: 0.0
    y_um: 0.0
    z_um: 0.0
  type: electron
  weight: 1.0

output:
  keep_particle_history: false
  export_time_steps: true
  export_frequency: 100

quench_circuit:
  enabled: false
  resistance_ohm: 1.0
  capacitance_F: 1.0
  biased_contact: drain
  ramo_current_sign: -1.0
  background_ramo_current_A: 0.0
  auto_background_ramo_current: false

avalanche_detection:
  voltage_drop_V: 1.0

quench_detection:
  high_field_V_per_cm: 1.0e5
  quiet_time_s: 1.0e-11
