# 2D self-consistent PBMC example for an nMOS device.
# Add a device.msh file in this directory with contact regions named
# "source", "drain", "body", and "gate".

input:
  device_mesh: device.msh
  material: Si

run:
  name: nmos
  output_directory: ""
  threads: 1
  seed: 0

simulation:
  final_time_s: 10e-12
  time_step_s: 1e-15
  temperature_K: 300
  max_particles: 1000000000
  poisson_frequency: 5
  stop_when_no_electrons: true

transport:
  max_energy_eV: 10
  gamma_safety_factor: 1.2
  gamma_samples: 1000
  impact_ionization: false
  particle_creation: false
  impurity_scattering: false

contacts:
  voltages_V:
    source: 0.0
    drain: 0.1
    body: 0.0
    gate: 1.0
  collecting:
    source: true
    drain: true
  ramo_electrode: drain
  apply_built_in_potential: false

particles:
  initialize_from_doping: true
  initial_weight: 2.0
  contact_injection_weight: 2.0

geometry_2d:
  effective_depth_um: 0.25
  particle_z_period_um: 0.25

output:
  keep_particle_history: false
  export_time_steps: true
  export_frequency: 100

quench_circuit:
  enabled: false
  biased_contact: drain
