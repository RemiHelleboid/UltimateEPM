# 2D self-consistent PBMC example for a PN junction.
# Add a device.msh file in this directory with contact regions named
# "anode" and "cathode".

input:
  device_mesh: device.msh
  material: Si

run:
  name: pn_junction
  output_directory: ""
  threads: 1
  seed: 0

simulation:
  final_time_s: 100e-12
  time_step_s: 1e-15
  temperature_K: 300
  max_particles: 1000000000
  poisson_frequency: 5
  stop_when_no_electrons: true

transport:
  max_energy_eV: 10
  gamma_safety_factor: 1.2
  gamma_samples: 1000
  impact_ionization: true
  particle_creation: true
  impurity_scattering: false

contacts:
  voltages_V:
    anode: 0.0
    cathode: 0.0
  collecting:
    anode: true
    cathode: true
  ramo_electrode: anode
  apply_built_in_potential: true
  intrinsic_concentration_cm_3: 1.0e10
  built_in_voltage_scale: 1.0

particles:
  initialize_from_doping: true
  initial_weight: 2.0
  contact_injection_weight: 2.0

geometry_2d:
  effective_depth_um: 1.0
  particle_z_period_um: 1.0

output:
  keep_particle_history: false
  export_time_steps: true
  export_frequency: 100

quench_circuit:
  enabled: false
  biased_contact: cathode
